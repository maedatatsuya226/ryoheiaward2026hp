# 受賞者発表の予約マージ
# 2026-09-18 17:00 JST (08:00 UTC) に redesign-2026 を main へマージして本番公開する。
# 実行後は自分自身(このファイル)を削除する。
# GitHubのスケジューラの特性上、数分程度遅れて起動することがある。
name: scheduled-merge-award-announcement

on:
  schedule:
    - cron: "0 8 18 9 *" # 08:00 UTC = 17:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge redesign-2026 into main and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/redesign-2026 --no-edit
          git rm -q .github/workflows/scheduled-merge.yml
          git commit -m "受賞者発表の予約マージを実行し、予約用ワークフローを削除"
          git push origin main
